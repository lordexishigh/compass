# Secret scanning configuration.
#
# The gate runs on every pull request over the whole of git *history* — a credential committed and
# then reverted is still leaked — and fails the build on a detected credential.
#
# The allowlist below is deliberately narrow: two exact values and one directory. Blanket-ignoring
# `.env*` is the commonest way this gate becomes decorative: `.env.local` is exactly where a real key
# lands, so the pattern that would make the first build green is the pattern that makes every later
# build meaningless. A real credential committed to `.env.example` is still a finding here, and always
# will be.
#
# The single `paths` entry is argued for where it sits. The test it has to pass is not "is a path
# exemption ever acceptable" but "is this directory one where a real credential could plausibly land,
# and is anything else checking it" — and for the rule sources the answers are no and yes. Any further
# entry has to clear the same bar.
#
# `.env.local` is untracked and covered by `.gitignore` (`.env.*`), so it never reaches history and
# needs no entry here. If it ever appears in a diff, this gate should and will fail.

[extend]
useDefault = true

[[rules]]
id = "compass-postgres-url-with-password"
description = "A PostgreSQL connection string carrying a non-placeholder password"
# The shape of a connection string with a password in it, and nothing cleverer.
#
# This rule previously excluded the placeholders with a negative lookahead — `(?!compass@|postgres@)`
# — which cannot work: gitleaks compiles rule patterns with Go's `regexp`, which is RE2 and has no
# lookaround at all. It rejected the config with "invalid or unsupported Perl syntax: `(?!`", so the
# whole step aborted before scanning anything, on every pull request and every nightly run. A gate
# that cannot parse its own configuration is worse than no gate: it goes red for a reason nobody reads
# as "no scanning happened".
#
# So the exemption moved to where gitleaks can express it — the allowlist `regexes` below — and the
# pattern is now plain RE2. The `{8,}` bound does most of the work on its own: every placeholder in
# this repository uses the password `compass`, which is seven characters, so none of them reach it.
regex = '''postgres(?:ql)?://[a-zA-Z0-9._%-]+:[^\s:@/]{8,}@'''
tags = ["database", "credential"]

# One allowlist. Two exempt values, and exactly one exempt path.
#
# ## The values
#
# The `paths` entry that used to sit here — `^\.env\.example$` — was a hole rather than a narrowing.
# Gitleaks ORs the conditions inside an allowlist by default (`condition = "OR"`), so the path entry
# exempted that file from *every* rule on its own, and the comment claiming the path and the values
# were ANDed described behaviour the file did not have. A live key pasted into `.env.example` would
# have been reported by nothing.
#
# Matching by literal value instead is what the surrounding argument always meant: these two exact
# loopback strings are documentation, and anything else anywhere is a finding. Both strings are kept
# even though the `{8,}` bound already spares the first, because the allowlist also applies to the
# inherited default rules.
#
# ### `regexTarget = "line"`, without which the second value exempted nothing
#
# With `regexTarget` unset, gitleaks matches an allowlist regex against the **finding's secret**, not
# against the line it came from. The rule above declares no capture group, so the secret is the whole
# match — and the match terminates at the `@`, because that is where the pattern ends. For the second
# placeholder the secret is therefore `postgresql://postgres:postgres@` and nothing longer, while the
# allowlist string is the full URL including the host and database. A pattern strictly longer than the
# text it is tested against cannot match, so the exemption never fired and the placeholder was a live
# finding.
#
# The place it was a finding is this file. That string exists nowhere else in the repository and never
# has — `git log -S` finds it only in `.gitleaks.toml` — because every real placeholder uses the
# seven-character `compass` password that `{8,}` spares. So the allowlist entry written to exempt a
# credential-shaped string was itself the only credential-shaped string, and it exempted itself from
# nothing. The same shape of defect as a lint rule tripping its own gate, one file over.
#
# `regexTarget = "line"` matches these regexes against the whole line instead, which is what the
# comment above always described. It does not widen the exemption in any way that matters: both values
# are complete literal connection strings, so a line matching one *contains* one, and a line containing
# a real credential still matches neither.
#
# ## The one path, and why it is not the same mistake
#
# `tools/eslint-plugin-compass/rules/` holds the credential-hygiene rules themselves. A file whose
# subject is "what a credential looks like" attracts scanner hits for the same reason a dictionary of
# rude words does, and the fix that matters is upstream: those files describe provider shapes in prose
# instead of quoting them, and `tools/quality-gates/tests/security-posture.test.ts` scans the shipped
# tree — comments included — and fails on a credential-shaped literal anywhere in it, this directory
# included. This entry stops a future edit to the rule vocabulary from re-tripping gitleaks; it is not
# what keeps the directory clean, and the gate that does still runs over it.
#
# Which is the difference from the `.env.example` entry. That one switched scanning off for the file
# where a real key was most likely to land, and nothing else checked it. This one is scoped to a
# directory that contains no secrets, cannot contain a deployment's secrets, and is independently
# asserted to hold no credential literal. It is deliberately the directory and not `tools/`, and a
# path rather than a regex, so it cannot widen by accident.
[allowlist]
description = "The loopback placeholders, and the rule sources whose subject matter is credential shapes"
# Match `regexes` against the whole line rather than against the finding's secret. See the note above:
# this rule captures nothing, so its secret stops at the `@` and a full-URL exemption could never match.
regexTarget = "line"
regexes = [
  '''postgresql://compass:compass@localhost:5432/compass''',
  '''postgresql://postgres:postgres@localhost:5432/compass''',
]
paths = [
  '''tools/eslint-plugin-compass/rules/''',
]
