# Keeps this project's dependencies patched via weekly grouped PRs.
# Generated by nous — safe to edit.
#
# Only "/" is a real npm project, and that is the whole of this file's history.
#
# Three other directories were configured — "/apps/web", "/apps/web/.next" and
# "/apps/web/.next/types" — and none of them could ever produce a mergeable PR:
#
#   * `.next/` and `.next/types/` are gitignored Next.js BUILD OUTPUT. Dependabot
#     tracked the generated `package.json` marker files Next writes there as
#     separate npm ecosystems, producing "Update" jobs with no real lockfile to
#     resolve against. Every one of them failed. gym-crm-programs hit exactly this
#     and fixed it the same way; see its own `.github/dependabot.yml`.
#
#   * "/apps/web" is a pnpm WORKSPACE MEMBER, not a project. The only lockfile is
#     `pnpm-lock.yaml` at the repo root, so a per-directory update edits
#     `apps/web/package.json` and cannot touch the lockfile that pins it. Every
#     gate here runs `pnpm install --frozen-lockfile`, which then fails on a
#     manifest the lockfile does not match — so those PRs were red by
#     construction, not by regression. Four of them (#2, #3, #4, #15) sat open
#     for two weeks for this reason, and #3/#8 were the same Next bump filed
#     twice, once correctly from "/" and once unmergeably from here.
#
# The root entry already covers every workspace package, because pnpm resolves
# the whole workspace from this one lockfile.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
