name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The named gates.
  #
  # One job per gate family rather than one `pnpm run verify` step, because the criterion is that
  # *every documented gate runs on every pull request* and that a failure names the gate. A single
  # green or red check called "verify" satisfies neither: a reviewer cannot see which gates ran, and a
  # gate silently removed from a package.json looks identical to one that passed.
  #
  # Each gate's failure message is the assertion's own — `tools/quality-gates` and the suites it wraps
  # already name the offending artifact — so nothing here echoes a summary that could drift from what
  # actually failed. The job *name* supplies the gate; the test output supplies the artifact.
  # ---------------------------------------------------------------------------
  gate-lint:
    name: 'gate: lint (clock reads, no charts, secret disclosure, jsx-a11y)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `compass/no-system-clock`, `no-time-library-imports`, `no-clock-instantiation`,
      # `no-analysis-io`, `no-secret-disclosure`, plus the jsx-a11y set over apps/web. The clock and
      # purity rules are also enforced by an independent textual scan in `gate-quality-gates`, so each
      # is checked twice by two mechanisms that cannot both be switched off by one edit.
      - run: pnpm run lint

  gate-architecture:
    name: 'gate: architecture (layer boundaries, analysis purity)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dependency-cruiser over packages/apps/tools. Names the offending edge on failure.
      - run: pnpm run arch

  gate-typecheck:
    name: 'gate: typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  gate-suites:
    # Fanned out per workspace so a failure names the gate in the check title rather than only in a
    # 3,000-line log. Every package carries its own vitest.config.ts, so a root-level `vitest run`
    # would report success while discovering none of tools/* — which is exactly the false green this
    # matrix exists to prevent. `fail-fast: false` so one broken gate does not hide the others.
    name: 'gate: ${{ matrix.gate }}'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # `filters` is the literal flag string, one `--filter` per package. Spelling the flags out
          # here rather than assembling them in the run step keeps the shell line trivial: a clever
          # expression that silently expanded to no filter at all would run the whole workspace and
          # report it under one gate's name, which is worse than either alternative.
          - gate: quality-gates (determinism, clock scan, grounding corpus, budgets, isolation, encoding)
            filters: --filter @compass/quality-gates
          - gate: golden fixtures + determinism
            filters: --filter @compass/golden
          - gate: web (accessibility, role matrix, headers, no-chart, degradation)
            filters: --filter @compass/web
          - gate: worker (pipeline ordering, delivery, generation, privacy)
            filters: --filter @compass/worker
          - gate: analysis (purity, budgets, report invariants)
            filters: --filter @compass/analysis
          - gate: pipeline + observability (alert rules, structured events)
            filters: --filter @compass/pipeline --filter @compass/observability
          - gate: narrator + memos (grounding, minimization)
            filters: --filter @compass/narrator --filter @compass/memos
          - gate: db + auth (migrations, tenant isolation, seats)
            filters: --filter @compass/db --filter @compass/auth
          # Its own leg rather than a name in the list below, because what it asserts is money and
          # access: the webhook signature, one state change per redelivered event, the trial and
          # dunning boundaries, and the downgrade that must be refused. A failure in any of those
          # deserves to name itself in the check title.
          - gate: billing (plans, entitlement, webhook signature, idempotency)
            filters: --filter @compass/billing
          # Its own leg for the same reason as billing: these suites assert the *content* of published
          # commitments — the subprocessor list, the 30-day notice window, the Article 22 statement and the
          # no-individual-ranking stance. A failure here means something Compass published in its own name
          # is no longer true, and that reads badly buried in a sweep called "remaining layers".
          - gate: trust (subprocessors, DPIA, Article 22, no-ranking stance)
            filters: --filter @compass/trust
          - gate: remaining layers
            filters: >-
              --filter @compass/clock --filter @compass/connector-port --filter @compass/ingest
              --filter @compass/knowledge-model --filter @compass/renderers --filter @compass/delivery
              --filter @compass/seed-connector --filter @compass/github-connector
              --filter @compass/jira-connector
              --filter @compass/seed-snapshot --filter @compass/smoke
              --filter @compass/perf-budget --filter @compass/eslint-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: run the gate
        run: pnpm ${{ matrix.filters }} --workspace-concurrency=1 --reporter=append-only run test

  # A belt-and-braces whole-workspace run, so a package added without a matrix entry is still
  # executed and cannot slip through the fan-out above unnoticed.
  verify:
    name: whole-workspace test sweep (catches an unmatrixed package)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every workspace's tests, recursively.
      #
      # `gate-suites` above already runs these fanned out per gate, and this is deliberately not that
      # list again: it is `pnpm -r`, which discovers packages from the workspace globs rather than from
      # a matrix somebody has to remember to edit. A package added without a matrix entry is therefore
      # still executed here, which is the one thing the fan-out cannot check about itself.
      #
      # Lint, architecture and typecheck are their own jobs above rather than steps here, so each is a
      # named check. `pnpm run verify` still chains all four for local use.
      - run: pnpm run test

      # The seed is checked in, so a regeneration that produces different bytes is
      # a determinism regression rather than a routine diff.
      - name: the checked-in seed still regenerates byte for byte
        run: |
          pnpm run seed:generate
          git diff --exit-code -- seed/

      # The same argument, one layer up. `pnpm run verify` has already compared live
      # analysis output against the checked-in fixtures; this proves the *writer* is
      # deterministic too, so `golden:update` on an unchanged tree is a no-op. A
      # regeneration that dirtied the tree would mean the fixtures encode something
      # about the machine that produced them.
      - name: the checked-in golden fixtures still regenerate byte for byte
        run: |
          pnpm run golden:update
          git diff --exit-code -- fixtures/

  # ---------------------------------------------------------------------------
  # Supply chain: secrets, dependencies, base image.
  #
  # All three run on every pull request. The nightly sweep over `master` lives in
  # `.github/workflows/nightly.yml` — same scanners, different trigger, because a dependency that
  # becomes vulnerable on a Tuesday does so without anybody opening a pull request.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: 'gate: secret scan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans *history*, so a shallow clone would silently check one commit and pass. A
          # credential committed and then reverted is still a leaked credential.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-scan:
    name: 'gate: dependency scan (critical CVE with a fix blocks)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm audit` exits non-zero on *any* advisory, so its exit code is discarded and the JSON is
      # judged by `tools/audit-critical.mjs`, which blocks only on a critical advisory that has a
      # published fix and prints the package and the version to move to. `pipefail` is off for the
      # same reason — the audit's own exit code is expected to be non-zero and is not the verdict.
      - name: critical vulnerabilities with an available fix
        run: |
          set +e
          pnpm audit --json > audit.json
          set -e
          node tools/audit-critical.mjs < audit.json

      - name: audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json
          if-no-files-found: warn

  sbom:
    name: software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CycloneDX, from the installed tree rather than from the manifests.
      #
      # `pnpm list --depth Infinity` reports what `--frozen-lockfile` actually installed, so the SBOM
      # describes the dependency graph that shipped rather than the ranges somebody declared. A bill of
      # materials generated from `package.json` would omit every transitive dependency, which is the
      # half a vulnerability question is always about.
      #
      # `--prod` is deliberately absent: a supply-chain question covers the build too. A compromised
      # test runner or bundler reaches the artifact just as surely as a runtime dependency does.
      - name: generate the SBOM
        run: |
          pnpm list --recursive --depth Infinity --json > sbom-tree.json
          node tools/sbom.mjs < sbom-tree.json > compass-sbom.cdx.json
          node -e "const s=require('./compass-sbom.cdx.json');console.log('components:',s.components.length)"

      # 90 days, named, and referenced by `docs/SBOM.md` so the retrieval process is a documented path
      # rather than folklore. The trust page points a controller at the same document.
      - name: publish the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: compass-sbom
          path: |
            compass-sbom.cdx.json
            sbom-tree.json
          retention-days: 90
          if-no-files-found: error

  image-scan:
    name: 'gate: container image scan'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The same image the cold-start and perf jobs measure, so what is scanned is what ships.
      - name: build the image
        run: docker compose build

      # The `web` service by name. Never "whichever image compose happens to list first".
      #
      # This read `docker compose config --images | head -n 1`, which in this compose file resolves to
      # `postgres:17-alpine`: `postgres` is declared first and is the only service carrying an `image:`
      # key, because `web` and `worker` are `build:` services. So the step directly above, whose comment
      # promises "what is scanned is what ships", was scanning the database and never once looked at the
      # Compass image — a gate that reported green about an artifact it had not opened.
      #
      # Naming the service resolves the tag compose assigns a build-only service, which is the tag
      # `docker compose build` produced a step earlier. `worker` is the same image with a different
      # command, so scanning `web` covers both.
      - name: resolve the built image tag
        id: image
        run: |
          ref="$(docker compose config --images web)"
          if [ -z "$ref" ]; then
            echo "docker compose config --images web resolved no image; the service may have been renamed." >&2
            exit 1
          fi
          echo "scanning $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Base-image and OS-package CVEs. `exit-code: 1` with `severity: CRITICAL` and
      # `ignore-unfixed: true` is the same policy the dependency gate applies to npm packages: block on
      # a critical finding somebody can actually fix, report the rest without making the gate
      # unsatisfiable.
      - name: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  cold-start:
    name: docker compose cold start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Built in its own step, so the image build is *not* inside the measured window.
      #
      # `docker compose up -d --build` was one command and it charged compiling the
      # application to the cold-start budget. Building is a CI cost that a person running
      # `docker compose up` on a released image never pays, so measuring it made the
      # number mean something nobody cares about — and it was the reason the gate had been
      # loosened to 180 s. Splitting the two is what lets the published 60 s be the gate.
      - name: docker compose build
        run: docker compose build

      # A clean checkout, no `.env` written first: the compose file supplies working
      # defaults, because a demo that needs configuration is not a zero-config demo, and
      # CI proving otherwise is the point of this job.
      #
      # This is where the measured window opens. Everything inside it — PostgreSQL's
      # first-boot initdb, migrations, the seed load, the first ingest, the first
      # generation, the first render — is Compass starting, which is what the criterion is
      # about.
      - name: docker compose up
        run: docker compose up -d

      # The acceptance criterion, as a command, **at its published number**. `@compass/smoke`
      # fetches `/`, waits for a report within its budget, and asserts all six section
      # headings, the fixed order, at least one source link, no login form, no setup wizard,
      # no empty state and no chart. The same function runs against the real rendered page in
      # `apps/web/tests/cold-start.test.tsx`, so a green suite and a green container are
      # checking the same thing.
      #
      # 60000 ms, matching `COLD_START_BUDGET_MILLIS` and the row in `docs/budgets.md`. No
      # override: a step that passed at three times its published budget was a gate in name
      # only, and the honest options were to enforce the number or to publish the one being
      # enforced. Excluding the build made the first one possible.
      - name: fetch / and assert a full six-section report within 60 s
        env:
          COMPASS_SMOKE_URL: http://localhost:3000/
          COMPASS_SMOKE_BUDGET_MS: '60000'
        run: pnpm run smoke

      # `pnpm smoke` already follows the first evidence link and insists on a page,
      # so this only adds the readiness surface, which states every capability and
      # its condition rather than implying them.
      - name: the readiness endpoint answers
        run: curl --fail --silent --show-error http://localhost:3000/api/health

      - name: container logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: docker compose down
        if: always()
        run: docker compose down --volumes

  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Its own job rather than a step in `verify`, for the same reason `cold-start` is one:
      # `pnpm run verify` runs in-process against jsdom and cannot measure a paint. An LCP
      # budget asserted without a renderer is not asserted.
      #
      # Build split from boot here too. This job measures nothing about start-up, so the split
      # is not load-bearing — but leaving one job with `--build` folded in is how the habit
      # comes back to the job where it does matter.
      - name: docker compose build
        run: docker compose build

      - name: docker compose up
        run: docker compose up -d

      # `@compass/perf-budget` launches the Chromium-family browser the machine already has —
      # `msedge`, then `chrome`, then a bundled `chromium` — and **fails rather than skips**
      # when none launch. So the browser has to be present, and it is named here rather than
      # assumed: a runner image that stopped shipping Chrome would otherwise surface as a
      # mysterious budget failure instead of as a missing dependency.
      - name: the throttled browser is available
        run: |
          google-chrome --version || chromium --version || microsoft-edge --version

      # Wait for a report before measuring. `pnpm perf` navigates to `/` and reads LCP; doing
      # that while the first report is still generating would measure the cold start, which is
      # the other job's budget and a different number.
      #
      # This wait is a **precondition, not a gate**, and the generous budget says so: the
      # cold-start assertion lives in the `cold-start` job at its published 60 s, and duplicating
      # it here would mean one criterion enforced by two steps that could disagree. What this
      # step must not do is fail the perf job for being slow to start — that is the other job's
      # verdict to give.
      - name: wait for a full six-section report before measuring
        env:
          COMPASS_SMOKE_URL: http://localhost:3000/
          COMPASS_SMOKE_BUDGET_MS: '180000'
        run: pnpm run smoke

      # The two numbered budgets: 2000 ms LCP on the report, 5000 ms for a time-travel
      # regeneration. Both are constants in `tools/perf-budget/src/index.ts` and both are
      # published in `docs/budgets.md`; this is the job that makes them gates.
      - name: assert the performance budgets
        env:
          COMPASS_PERF_BASE_URL: http://localhost:3000
        run: pnpm run perf

      - name: container logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: docker compose down
        if: always()
        run: docker compose down --volumes
