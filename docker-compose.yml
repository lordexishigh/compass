# The canonical zero-config cold start.
#
#   docker compose up
#   open http://localhost:3000
#
# A clean checkout, one command, a fully generated six-section report. No login
# wall, no connector wizard, no empty state, and no `.env` to write first: every
# value below has a working default, because a demo that needs configuration is
# not a zero-config demo.
#
# The web container migrates, provisions the roster and generates today's report
# *before* it binds the port — see `tools/docker/entrypoint.sh`. That is what makes
# the first request a read rather than a full ingest with a manager waiting on it.
services:
  postgres:
    image: postgres:17-alpine
    container_name: compass-postgres
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    ports:
      - '5432:5432'
    volumes:
      - compass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U compass -d compass']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compass-web
    command: ['web']
    environment:
      # Both point at the same instance locally. In production the pooled URL is a
      # transaction-mode pooler and the direct one is not: migrations, advisory
      # locks and pg-boss maintenance cannot run through a pooler.
      DATABASE_URL: postgresql://compass:compass@postgres:5432/compass
      DATABASE_URL_DIRECT: postgresql://compass:compass@postgres:5432/compass
      COMPASS_DEFAULT_TIMEZONE: ${COMPASS_DEFAULT_TIMEZONE:-Europe/London}
      COMPASS_DEFAULT_TEAM: ${COMPASS_DEFAULT_TEAM:-platform}
      # The first owner. Passed through rather than defaulted here: unset, the boot
      # script uses the published demonstration credentials and prints them, and
      # `/api/health` reports `seats: not_configured` for as long as that is true. So
      # `docker compose up` gives you an account to sign in with, and a deployment that
      # kept the demo password cannot look healthy. See `.env.example`.
      COMPASS_OWNER_EMAIL: ${COMPASS_OWNER_EMAIL:-}
      COMPASS_OWNER_PASSWORD: ${COMPASS_OWNER_PASSWORD:-}
      COMPASS_OWNER_NAME: ${COMPASS_OWNER_NAME:-}
      # Where a mailed sign-in, reset or invitation link points. Unset is fine while you
      # open this on localhost — links use that origin. Reaching the container by LAN
      # address or through a proxy needs this set: the origin is never taken from a request
      # header, because the reset endpoint is public and a caller who chose the host would
      # choose where somebody else's single-use token pointed. See `.env.example`.
      COMPASS_BASE_URL: ${COMPASS_BASE_URL:-}
      # Narration is optional. Absent, the report renders through the
      # deterministic template renderer and the page says which renderer wrote it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '${COMPASS_WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The scheduled side: ingest, generation and delivery on a cadence. Not needed
  # to read a report — the web container's boot already generated today's — so it
  # is in a profile and `docker compose up` does not wait on it.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compass-worker
    command: ['worker']
    profiles: ['worker']
    environment:
      DATABASE_URL: postgresql://compass:compass@postgres:5432/compass
      DATABASE_URL_DIRECT: postgresql://compass:compass@postgres:5432/compass
      COMPASS_DEFAULT_TIMEZONE: ${COMPASS_DEFAULT_TIMEZONE:-Europe/London}
      COMPASS_DEFAULT_TEAM: ${COMPASS_DEFAULT_TEAM:-platform}
      # The worker's boot also calls `bootstrapOwner`, which is idempotent — so the two
      # containers starting together do not produce two owner seats. They must agree on
      # the credentials, though, or whichever boots first wins.
      COMPASS_OWNER_EMAIL: ${COMPASS_OWNER_EMAIL:-}
      COMPASS_OWNER_PASSWORD: ${COMPASS_OWNER_PASSWORD:-}
      COMPASS_OWNER_NAME: ${COMPASS_OWNER_NAME:-}
      COMPASS_BASE_URL: ${COMPASS_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  compass-pgdata:
